services:
  mihomo-bootstrap:
    image: alpine:3.21
    restart: "no"
    user: "0:0"
    environment:
      MIHOMO_SECRET: ${MIHOMO_SECRET:?Set MIHOMO_SECRET in .env}
    volumes:
      - mihomo-runtime:/runtime
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        case "$$MIHOMO_SECRET" in
          ""|replace-with-a-long-random-secret)
            echo "MIHOMO_SECRET is a placeholder. Set a unique random secret in .env (for example: openssl rand -hex 32)." >&2
            exit 1
            ;;
        esac
        if [ "$${#MIHOMO_SECRET}" -lt 32 ]; then
          echo "MIHOMO_SECRET must contain at least 32 characters." >&2
          exit 1
        fi
        mkdir -p /runtime/active
        if [ ! -s /runtime/active/config.yaml ]; then
          umask 027
          printf 'mixed-port: 7890\nallow-lan: true\nbind-address: "*"\nmode: rule\nlog-level: info\nexternal-controller: 0.0.0.0:9090\nexternal-controller-cors:\n  allow-origins:\n    - http://127.0.0.1:8081\n    - http://localhost:8081\n  allow-private-network: false\nsecret: "%s"\nproxies: []\nproxy-groups: []\nrules:\n  - MATCH,DIRECT\n' "$$MIHOMO_SECRET" > /runtime/active/config.yaml
        fi
        chown -R 100:100 /runtime

  mihomo-studio:
    build:
      context: .
      args:
        MIHOMO_IMAGE: ${MIHOMO_IMAGE:-metacubex/mihomo:v1.19.32}
    restart: unless-stopped
    environment:
      LISTEN_ADDR: ":8080"
      DATABASE_PATH: /data/mihomo-studio.db
      SNAPSHOT_DIR: /data/snapshots
      ACTIVE_CONFIG_PATH: /runtime/active/config.yaml
      MIHOMO_CONTROLLER_URL: http://mihomo:9090
      MIHOMO_SECRET: ${MIHOMO_SECRET:?Set MIHOMO_SECRET in .env}
      # The generated config lists these origins for controller CORS. A dashboard reached on a
      # LAN address is a different origin than loopback, so serving one there requires listing
      # it here or the browser's controller calls are rejected. Comma-separated; empty keeps
      # the loopback defaults.
      DASHBOARD_ORIGINS: ${DASHBOARD_ORIGINS:-}
    ports:
      # LAN-accessible by default; the API requires MIHOMO_SECRET. Restrict this port
      # with the host firewall if the subnet contains untrusted devices.
      - "${STUDIO_BIND_IP:-0.0.0.0}:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - app-data:/data
      - mihomo-runtime:/runtime
    depends_on:
      mihomo-bootstrap:
        condition: service_completed_successfully
      mihomo:
        condition: service_started
    networks: [control]

  metacubexd:
    image: ghcr.io/metacubex/metacubexd:v1.273.1@sha256:99b3a077be98b5a8db756f05b561e28072147cd9e6651dd521150046b57fd9d0
    profiles: [diagnostics]
    restart: unless-stopped
    ports:
      # Loopback by default. Set DASHBOARD_BIND_IP to serve the official dashboard on a LAN
      # address; the Studio then needs DASHBOARD_ORIGINS to list that exact origin, because
      # the controller rejects browser calls from an origin it was not told about.
      - "${DASHBOARD_BIND_IP:-127.0.0.1}:8081:80"
    depends_on:
      mihomo:
        condition: service_started
    networks: [control]

  mihomo:
    image: ${MIHOMO_IMAGE:-metacubex/mihomo:v1.19.32}
    restart: unless-stopped
    command: ["-d", "/root/.config/mihomo", "-f", "/runtime/active/config.yaml"]
    environment:
      SAFE_PATHS: /runtime/active:/data/snapshots
    ports:
      - "${MIHOMO_BIND_IP:-127.0.0.1}:7890:7890"
      # Loopback by default. Set CONTROLLER_BIND_IP to expose the controller on a LAN
      # address, for example so metacubexd on another host can reach it. The controller
      # can rewrite live routing and is protected only by MIHOMO_SECRET. See docs/security.md.
      - "${CONTROLLER_BIND_IP:-127.0.0.1}:9090:9090"
    healthcheck:
      test: ["CMD", "/mihomo", "-v"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - mihomo-runtime:/runtime
      - mihomo-state:/root/.config/mihomo
    depends_on:
      mihomo-bootstrap:
        condition: service_completed_successfully
    networks: [control]

volumes:
  app-data:
  mihomo-runtime:
  mihomo-state:

networks:
  control:
    internal: false
